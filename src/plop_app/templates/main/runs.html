{% extends "base.html" %}

{% block content %}
  <h1>Runs</h1>
  <p class="muted">Each run is one batch of receipts and invoices.</p>

  <form class="card upload" method="post" action="{{ url_for('main.create_run') }}" enctype="multipart/form-data">
    <label for="name">Run name</label>
    <input id="name" name="name" placeholder="e.g. Example documents">

    <label for="files">Documents</label>
    <input id="files" name="files" type="file" accept="image/*,.pdf" multiple>

    <button type="submit">Upload</button>
  </form>

  <div class="card">
    <table>
      <thead>
        <tr><th>Run</th><th>Added</th><th>Documents</th></tr>
      </thead>
      <tbody>
        {% for run in runs %}
          <tr>
            <td><a href="{{ url_for('main.run_detail', run_id=run.id) }}">{{ run.name }}</a></td>
            <td>{{ run.created_at.strftime("%d %b %Y, %H:%M") }}</td>
            <td>{{ run.documents | length }}</td>
          </tr>
        {% else %}
          <tr><td colspan="3" class="muted">No runs yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
