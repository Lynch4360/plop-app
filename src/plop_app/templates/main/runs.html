{% extends "base.html" %}

{% block content %}
  <h1>Runs</h1>
  <p class="muted">Each run is one batch of receipts and invoices.</p>

  <div class="card">
    <table>
      <thead>
        <tr><th>Run</th><th>Added</th><th>Documents</th></tr>
      </thead>
      <tbody>
        {% for run in runs %}
          <tr>
            <td>{{ run.name }}</td>
            <td>{{ run.created_at.strftime("%d %b %Y, %H:%M") }}</td>
            <td>{{ run.documents | length }}</td>
          </tr>
        {% else %}
          <tr><td colspan="3" class="muted">No runs yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
