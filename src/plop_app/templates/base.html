<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Receipt &amp; Invoice Extraction{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <header class="site-header">
    <span class="site-name">Receipt &amp; Invoice Extraction</span>
      <nav>
          <a href="{{ url_for('main.runs') }}" class="{{ 'active' if request.endpoint == 'main.runs' }}">Runs</a>
          <a href="{{ url_for('main.analysis') }}" class="{{ 'active' if request.endpoint == 'main.analysis' }}">Analysis</a>
      </nav>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <small>ATU final-year project</small>
  </footer>
</body>
</html>
