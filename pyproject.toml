[project]
name = "plop-app"
version = "0.1.0"
description = "Comparative evaluation of OCR, local AI and cloud extraction of fields from Irish receipts and invoices"
readme = "README.md"
authors = [
    { name = "Danny Lynch", email = "g00437615@atu.ie" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
